name: Publicar maquetas en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/fase-3-diseno/mockups/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar las maquetas
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/fase-3-diseno/mockups

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
